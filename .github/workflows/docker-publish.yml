name: Build, Push and Deploy Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ASG_NAME: my-asg

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub 저장소 코드 가져오기
        uses: actions/checkout@v6

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 업로드
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx-site:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: AWS 임시 권한 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Auto Scaling 인스턴스 새로 고침 시작
        id: refresh
        shell: bash
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"InstanceWarmup":180,"MinHealthyPercentage":50}' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "인스턴스 새로 고침 시작: $REFRESH_ID"

      - name: 자동 배포 완료 대기
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "${{ steps.refresh.outputs.refresh_id }}" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "현재 상태: $STATUS"

            case "$STATUS" in
              Successful)
                echo "AWS 자동 배포 성공"
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "AWS 자동 배포 실패: $STATUS"
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "자동 배포 대기 시간 초과"
          exit 1